<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
     <link rel="stylesheet" href="css/global.css">
     <link rel="stylesheet" href="css/elements.css">
     <link rel="stylesheet" href="css/modal.css">

    <!-- Ícone de site -->
    <link rel="icon" type="image/png" href="assets/favicon_pokebola.png">
    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>Pokedex</title>
</head>
<body>
    <main>
        <h1>Pokedex</h1> 
        <img src="assets/pokebola_fundo.png" alt="Imagem de fundo" class="background_logo">

        <ol>
            <li>
                <div class="header_pokemon">
                    <div class="titulo_pokemon">Bulbasaur</div>
                    <div class="number_pokemon">#001</div>
                </div>
                <div class="type_pokemon">
                    <p>Grass</p>
                    <p>Poison</p>
                </div>
                <img src="assets/pokebola_fundo.png" alt="Imagem de fundo" class="background_pokemon">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/1.png" alt="Bulbasaur">
            </li>
            <li>
                <div class="header_pokemon">
                    <div class="titulo_pokemon">Ivysaur</div>
                    <div class="number_pokemon">#002</div>
                </div>
                <div class="type_pokemon">
                    <p>Grass</p>
                    <p>Poison</p>
                </div>
                <img src="assets/pokebola_fundo.png" alt="Imagem de fundo" class="background_pokemon">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/2.png" alt="Ivysaur">
            </li>
            <li>
                <div class="header_pokemon">
                    <div class="titulo_pokemon">Venusaur</div>
                    <div class="number_pokemon">#003</div>
                </div>
                <div class="type_pokemon">
                    <p>Grass</p>
                    <p>Poison</p>
                </div>
                <img src="assets/pokebola_fundo.png" alt="Imagem de fundo" class="background_pokemon">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/3.png" alt="Venusaur">
            </li>
            <li>
                <div class="header_pokemon">
                    <div class="titulo_pokemon">Charmander</div>
                    <div class="number_pokemon">#004</div>
                </div>
                <div class="type_pokemon">
                    <p>Fire</p>
                </div>
                <img src="assets/pokebola_fundo.png" alt="Imagem de fundo" class="background_pokemon">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/4.png" alt="Charmander">
            </li>
            <li>
                <div class="header_pokemon">
                    <div class="titulo_pokemon">Charmeleon</div>
                    <div class="number_pokemon">#005</div>
                </div>
                <div class="type_pokemon">
                    <p>Fire</p>
                </div>
                <img src="assets/pokebola_fundo.png" alt="Imagem de fundo" class="background_pokemon">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/5.png" alt="Charmeleon">
            </li>
            <li>
                <div class="header_pokemon">
                    <div class="titulo_pokemon">Charizard</div>
                    <div class="number_pokemon">#006</div>
                </div>
                <div class="type_pokemon">
                    <p>Fire</p>
                    <p>Flying</p>
                </div>
                <img src="assets/pokebola_fundo.png" alt="Imagem de fundo" class="background_pokemon">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/6.png" alt="Charizard">
            </li>
        </ol>
    </main>
</body>
</html>
